<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-screen sky canvas the rocket climbs through; one glass flight panel (right column on wide, bottom sheet on phones); HUD strip on top. Single committed night-launch look. */
:root{
  --ink:#EAF0FF; --muted:#9AA8CC; --panel:rgba(8,13,32,.88); --panel-2:rgba(255,255,255,.05);
  --line:rgba(170,190,255,.18); --flame:#FF8F3F; --flame-2:#FFD166; --deep:#03040C;
  --t-c:#A9B6D6; --t-u:#5FD3B4; --t-r:#FFD166; --t-x:#FF6F91; --t-miss:#5B6585;
  --display:"Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.mark{font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.readouts{display:flex;gap:8px}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;min-width:84px;text-align:right}
.ro b{display:block;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.ro span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#panel{position:fixed;z-index:6;top:50%;transform:translateY(-50%);right:max(24px,env(safe-area-inset-right,0px));
  width:min(440px,calc(100vw - 48px));max-height:calc(100% - 140px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
@media (max-width:760px){
  #panel{top:auto;transform:none;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:max(12px,env(safe-area-inset-bottom,0px));width:auto;max-height:60%;padding:18px}
  .ro{min-width:70px}
}
h1{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.14em;line-height:1;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--flame-2)}
.lede{color:var(--muted);margin:10px 0 0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:11px 16px;font-weight:600}
button:hover{background:rgba(255,255,255,.1)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--flame-2);outline-offset:2px}
.primary{background:linear-gradient(180deg,var(--flame-2),var(--flame));color:#1b0e02;border:0;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.primary:hover{filter:brightness(1.07);background:linear-gradient(180deg,var(--flame-2),var(--flame))}
.wide{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:8px 10px}
.stat b{font-family:var(--display);font-size:20px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.rules{margin:10px 0 0;padding-left:18px;color:var(--muted)}
.rules li{margin:4px 0}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.packs button{text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.packs b{font-family:var(--display);font-weight:600;font-size:14px}
.packs small{font-size:11px;color:var(--muted);font-weight:500}
.packs button:hover{border-color:color-mix(in srgb,var(--flame-2) 50%,transparent)}
.archive{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.archive button{padding:8px 0;font-family:var(--display);font-size:13px}
.archive button.done{color:var(--muted)}
.archive small{display:block;font-size:10px;color:var(--t-u);font-weight:500}
.prompt{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.timer{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--flame),var(--flame-2));transform-origin:left;width:100%}
.timer.low i{background:var(--t-x)}
.tline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink)}
.answer input::placeholder{color:#66729A}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:12px;padding:14px;background:var(--panel-2);border:1px solid var(--line)}
.fbtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.pts{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.c{color:var(--t-c)}.u{color:var(--t-u)}.r{color:var(--t-r)}.x{color:var(--t-x)}.miss,.time{color:var(--t-miss)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.note b{color:var(--ink);font-weight:500}
.result-alt{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:6px}
.log div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;background:var(--panel-2);border-radius:8px;font-size:13px}
.log em{font-style:normal;color:var(--muted);grid-column:1}
.log strong{grid-row:1 / span 2;grid-column:2;align-self:center;font-family:var(--display);font-size:18px}
.share{width:100%;min-height:90px;resize:none;font:13px/1.5 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:currentColor;margin-right:6px}
/* Motion: screens stagger in, feedback pops, results cascade, the panel eases between sizes */
#panel{transition:max-height .35s ease}
.screen>*{animation:rise .46s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.fb{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.12s}
.fb-x{border-color:color-mix(in srgb,var(--t-x) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--t-x) 25%,transparent),0 0 28px color-mix(in srgb,var(--t-x) 22%,transparent)}
.fb-r{border-color:color-mix(in srgb,var(--t-r) 45%,transparent)}
.fb .chip{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.log div{animation:rise .4s ease both;animation-delay:calc(var(--j,0) * 80ms + 250ms)}
.tries{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--t-x) 12%,transparent);border:1px solid color-mix(in srgb,var(--t-x) 35%,transparent);color:var(--ink)}
.tries .tried{color:var(--muted)}
.pop{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.timer i{transition:background-color .3s}
.timer.low{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
button{transition:transform .12s ease,background-color .2s ease,filter .2s ease}
button:active{transform:scale(.97)}
.answer input{transition:border-color .2s ease,box-shadow .2s ease}
.answer input:focus{border-color:color-mix(in srgb,var(--flame-2) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--flame) 20%,transparent);outline:none}
#panel{animation:panelIn .6s cubic-bezier(.2,.75,.25,1) both}
@keyframes panelIn{from{opacity:0;translate:0 24px}}
@media (prefers-reduced-motion:reduce){.shake,.screen>*,.fb,.fb .chip,.log div,.pop,.timer.low,#panel{animation:none!important}button:active{transform:none}}
</style>

    ["a color", ["Name a color"]], ["a language", ["Name a language"]], ["a dog breed", ["Name a dog breed"]], ["a breed of cat", ["Name a breed of cat"]],
    ["a musical instrument", ["Name a musical instrument"]], ["a river", ["Name a river"]], ["a mountain", ["Name a mountain"]], ["an island", ["Name an island"]],

    ["a sport", ["Name a sport","Name a sport played with a ball"]], ["a music genre", ["Name a music genre"]], ["a breed of horse", ["Name a breed of horse"]],
    ["a constellation", ["Name a constellation"]], ["a spice or herb", ["Name a spice or herb"]], ["a type of fabric", ["Name a type of fabric"]],
    ["a piece of furniture", ["Name a piece of furniture"]], ["a type of bread", ["Name a type of bread"]], ["a soup", ["Name a soup"]],
    ["a card game", ["Name a card game"]], ["a martial art", ["Name a martial art"]], ["a god or goddess", ["Name a god or goddess"]],
    ["a profession", ["Name a profession"]], ["a part of the body", ["Name a part of the human body"]], ["a flower", ["Name a flower"]],
    ["a type of tree", ["Name a type of tree"]], ["a type of dance", ["Name a type of dance"]], ["a type of hat", ["Name a type of hat"]],
    ["a programming language", ["Name a programming language"]], ["a famous landmark", ["Name a famous landmark"]], ["a sea or ocean", ["Name a sea or ocean"]],
    ["a type of pasta", ["Name a type of pasta"]], ["a vehicle", ["Name a vehicle"]], ["a type of shoe", ["Name a type of shoe"]], ["a desert", ["Name a desert"]]
  ];
  const usedQ = new Set(PROMPTS.map(p => p.q));
  function buildBase(src){
    const keyName = new Map(), baseTier = new Map(), order = [];
    for (const sq of src){
      const sp = byQ(sq); if (!sp || sp.map.size === 0) continue;
      for (const [k, v] of sp.map){

    if (pass.length < 12 || pass.length > max) return;
    const sorted = pass.map((n,i) => [n,i]).sort((a,b) => rank[B.baseTier.get(a[0])] - rank[B.baseTier.get(b[0])] || a[1]-b[1]).map(a => a[0]);

    for (const ch of "aeinorsy") fromBase(`Name ${noun} that ends in ${up(ch)}`, B, i => i.l.endsWith(ch));
    for (const n of [4,5,6,7]) fromBase(`Name ${noun} whose name has ${n} or fewer letters`, B, i => i.l.length <= n);
    fromBase(`Name ${noun} whose name has 10 or more letters`, B, i => i.l.length >= 10);
    fromBase(`Name ${noun} with more than one word in its name`, B, i => i.w > 1);
    fromBase(`Name ${noun} with a one-word name that has no letter E`, B, i => i.w === 1 && !i.l.includes("e"));
    fromBase(`Name ${noun} with a double letter in its name`, B, i => /(.)\1/.test(i.l));
  }
}

function lev(a,b){
  const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
function lookup(p, input){
  const n = norm(input); if (!n) return null;
  const vs = new Set([n, n.replace(/ /g,"")]);
  for (const w of [" tree"," cheese"," pasta"," noodles"," breed"," dog"," sea"," ocean"," flower"," state"," city"]) if (n.endsWith(w)) vs.add(n.slice(0,-w.length));
  for (const v of [...vs]) {
    if (v.endsWith("ies")) vs.add(v.slice(0,-3)+"y");
    if (v.endsWith("es")) vs.add(v.slice(0,-2));
    if (v.endsWith("s")) vs.add(v.slice(0,-1));
    vs.add(v+"s");
  }
  for (const v of vs) if (p.map.has(v)) return p.map.get(v);
  if (n.length >= 5) {
    const max = n.length >= 9 ? 2 : 1; let best = null;
    for (const [k,val] of p.map) {
      if (Math.abs(k.length - n.length) > max) continue;
      const d = lev(n,k); if (d <= max && (!best || d < best.d)) best = {d,val};
    }
    if (best) return best.val;
  }
  return null;
}

/* ---------------- Days, seeding, storage ---------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(n, rng){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function todayNum(){ const d=new Date(); d.setHours(0,0,0,0); return Math.round((d-EPOCH)/864e5)+1; }
function dateOf(n){ const d=new Date(EPOCH); d.setDate(d.getDate()+n-1); return d; }
// cyrb53-style string hash (well mixed, so daily picks don't cluster).
function hashStr(s){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ h2) >>> 0;
}
// Each prompt gets a per-day rank from its own text, so adding categories later barely changes past or future days.
// A round is 3 constraint templates, 2 twists and 2 classics, interleaved.
// Templates never share a base category within a round, so you won't get three "...a country..." prompts at once.
function baseOf(q){ return q.replace(/ (with the letter \w|that starts with \w|that ends in \w|whose name has .*|with more than one word.*|with a one-word name.*|with a double letter.*)$/, ""); }
function mixRound(tw, cl, tp){
  const picked = [], seen = new Set();
  for (const i of tp){ const b = baseOf(PROMPTS[i].q); if (seen.has(b)) continue; seen.add(b); picked.push(i); if (picked.length === 3) break; }
  for (const i of tp){ if (picked.length === 3) break; if (!picked.includes(i)) picked.push(i); }
  return [picked[0], cl[0], tw[0], picked[1], cl[1], tw[1], picked[2]];
}
function kindIdx(kind){ return PROMPTS.map((p,i) => [p,i]).filter(([p]) => p.kind === kind).map(([,i]) => i); }
// Daily picks work like a shuffled deck per kind: every prompt is dealt once before any prompt repeats.
const deckCache = new Map();
function deck(kind, cycle){
  const key = kind + "#" + cycle;
  if (!deckCache.has(key)) deckCache.set(key, kindIdx(kind).map(i => [hashStr(PROMPTS[i].q + "#deck" + cycle), i]).sort((a,b) => a[0]-b[0]).map(x => x[1]));
  return deckCache.get(key);
}
function deal(kind, n, per){
  const size = kindIdx(kind).length, out = [];
  for (let pos = (n - 1) * per; out.length < per && pos < (n - 1) * per + per * 3; pos++){
    const i = deck(kind, Math.floor(pos / size))[pos % size];
    if (!out.includes(i)) out.push(i);
  }
  return out;
}
function promptsFor(n){ return mixRound(deal("twist", n, 2), deal("classic", n, 2), deal("template", n, 4)); }
const STORE_KEY = "outlier:v1";
function loadStore(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {days:{}}; } catch { return {days:{}}; } }
let store = loadStore();
function saveStore(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {} }
function stats(){
  const days = store.days, done = Object.keys(days).filter(k => days[k].done).map(Number);
  const best = done.reduce((m,k)=>Math.max(m,total(days[k].answers)),0);
  let streak = 0, t = todayNum(); if (!days[t]?.done) t--;
  while (days[t]?.done) { streak++; t--; }
  return {played:done.length, streak, best};
}
function total(ans){ return ans.reduce((s,a)=>s+a.pts,0); }

/* ---------------- Shared player data (each player writes plays/<their id>; everyone reads) ---------------- */
const MIN_DATA = 15;
let counts = {}, playersToday = 0, sharedReady = false, db = null, uid = null, myDoc = null, writeChain = Promise.resolve();
function rebuild(docs){
  counts = {}; playersToday = 0; const t = String(todayNum());
  const add = arr => (Array.isArray(arr) ? arr : []).forEach(e => {
    if (!Array.isArray(e) || typeof e[0] !== "string" || typeof e[1] !== "string") return;
    const c = counts[e[0]] || (counts[e[0]] = {total:0, by:{}}); c.total++; c.by[e[1]] = (c.by[e[1]] || 0) + 1;
  });
  for (const d of docs){
    const body = d.data() || {}, days = body.days && typeof body.days === "object" ? body.days : {};
    for (const k in days) add(days[k]);
    if (Array.isArray(days[t]) && days[t].length) playersToday++;
    add(body.free);
  }
  sharedReady = true; updateLive();
}
function dataTier(q, name){
  const c = counts[q]; if (!c || c.total < MIN_DATA) return null;
  const n = c.by[name] || 0, share = n / c.total;
  return {t: share >= .12 ? "c" : share >= .05 ? "u" : share >= .015 ? "r" : "x", share, n, total: c.total};
}
function topPicks(p){
  const c = counts[p.q];
  if (c && c.total >= MIN_DATA) return {names: Object.entries(c.by).sort((a,b) => b[1]-a[1]).slice(0,4).map(e => e[0]), src: "players"};
  return {names: p.canon.c.slice(0,4), src: "list"};
}
function record(day, q, name){
  if (!db || !uid || !myDoc) return;
  if (day != null) (myDoc.days[String(day)] ||= []).push([q, name]);
  else { myDoc.free.push([q, name]); if (myDoc.free.length > 300) myDoc.free.splice(0, myDoc.free.length - 300); }
  const body = JSON.parse(JSON.stringify(myDoc));
  writeChain = writeChain.then(() => db.doc("plays/" + uid).set(body)).catch(() => {});
}
function updateLive(){
  const el = document.getElementById("live"); if (!el || !sharedReady) return;
  el.textContent = playersToday ? `${playersToday} ${playersToday === 1 ? "player has" : "players have"} launched today.` : "Nobody has launched today yet. You could be first.";
  el.hidden = false;
}
let sharedTries = 0;
async function initShared(){
  if (!window.claude || typeof window.claude.use !== "function"){ if (sharedTries++ < 3) setTimeout(initShared, 1500); return; }
  try {
    db = await window.claude.use("db"); if (!db) return;
    const user = await window.claude.use("user");
    uid = user ? await user.id() : null;
    db.collection("plays").limit(1000).onSnapshot(s => rebuild(s.docs), () => {});
    if (uid){
      const d = await db.doc("plays/" + uid).get(), b = d.exists ? d.data() : null;
      myDoc = {days: b && b.days && typeof b.days === "object" ? JSON.parse(JSON.stringify(b.days)) : {}, free: b && Array.isArray(b.free) ? b.free.slice() : []};
    }
  } catch {}
}

/* ---------------- Altitude helpers ---------------- */
function kmAt(s){
  s = Math.max(0, Math.min(MAXS, s));
  for (let i=1;i<MILES.length;i++){ const a=MILES[i-1], b=MILES[i];
    if (s <= b.s){ const t=(s-a.s)/(b.s-a.s); return a.km===0 ? b.km*t : a.km*Math.pow(b.km/a.km,t); } }
  return MILES[MILES.length-1].km;
}
function fmtKm(km){ return km < 10 ? km.toFixed(1)+" km" : Math.round(km).toLocaleString("en-US")+" km"; }
function reached(s){ let m = MILES[0]; for (const x of MILES) if (s >= x.s) m = x; return m; }
function zone(km){
  if (km < 12) return "Troposphere"; if (km < 50) return "Stratosphere"; if (km < 85) return "Mesosphere";
  if (km < 100) return "Thermosphere"; if (km < 2000) return "Low Earth orbit"; if (km < 35786) return "Medium Earth orbit";
  if (km < 384400) return "High orbit"; return "Lunar surface";
}

function countUp(el, to, fmt, ms){
  if (!el) return;
  if (REDUCE_MOTION || !to){ el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => { const t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
    el.textContent = fmt(to * e); if (t < 1 && el.isConnected) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function startDaily(n){
  if (!store.days[n]) store.days[n] = {answers:[], done:false};
  const d = store.days[n];
  run = {mode:"daily", day:n, prompts:promptsFor(n), answers:d.answers, i:d.answers.length};
  target = total(run.answers);
  if (d.done || run.i >= ROUNDS) return result();
  ask();
}
function startFree(packId){
  const rng = mulberry32((Math.random()*2**32)>>>0);
  const pack = PACKS.find(pk => pk.id === packId) || null;
  const pick = pool => shuffled(pool.length, rng).map(k => pool[k]);
  const prompts = pack ? pick(pack.idx).slice(0, ROUNDS) : mixRound(pick(kindIdx("twist")), pick(kindIdx("classic")), pick(kindIdx("template")));
  run = {mode:"free", pack: pack ? pack.id : null, day:null, prompts, answers:[], i:0};
  target = 0; cam = Math.min(cam, 0.001); ask();
}
function modeLabel(){
  if (run.mode === "daily") return "Launch #" + run.day;
  const pk = PACKS.find(p => p.id === run.pack);
  return pk ? esc(pk.name) + " pack" : "Free flight";
}

function ask(){
  const p = PROMPTS[run.prompts[run.i]];
  run.locked = false; run.timerEnd = performance.now() + SECONDS*1000;
  panel.innerHTML = `
  <div class="stack">
    <div class="eyebrow">${modeLabel()} · Prompt ${run.i+1} of ${ROUNDS}</div>
    <p class="prompt">${esc(p.q)}</p>
    <div>
      <div class="timer" id="timer"><i id="tbar"></i></div>
      <div class="tline" style="margin-top:6px"><span>Rarer answers fly higher</span><span id="tleft">${SECONDS}s</span></div>
    </div>
    <form class="answer" id="f" autocomplete="off">
      <input id="ans" type="text" placeholder="Type one answer" aria-label="Your answer" maxlength="60" autocapitalize="off" spellcheck="false">
      <button class="primary" type="submit">Fire</button>
    </form>
    <p class="note tries" id="tries" hidden></p>
  </div>`;
  run.misses = [];
  const f = document.getElementById("f"), inp = document.getElementById("ans");
  inp.focus();
  f.onsubmit = e => { e.preventDefault();
    if (!inp.value.trim()) { f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
    submit(inp.value, false); };
}

function submit(input, timedOut){
  if (!run || run.locked) return;
  const p = PROMPTS[run.prompts[run.i]];
  const hit = timedOut ? null : lookup(p, input);
  if (!timedOut && !hit){
    // Not in the flight list: let them try again while the clock keeps running.
    const tried = input.trim(); run.misses.push(tried);
    const tries = document.getElementById("tries"), f = document.getElementById("f"), inp = document.getElementById("ans");
    if (tries){
      tries.innerHTML = `<b>${esc(tried)}</b> isn't in the flight list. Try another answer before the clock runs out.`
        + (run.misses.length > 1 ? `<br><span class="tried">Tried: ${run.misses.map(esc).join(", ")}</span>` : "");
      tries.hidden = false; tries.classList.remove("pop"); void tries.offsetWidth; tries.classList.add("pop");
    }
    if (f){ f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }
    if (inp){ inp.value = ""; inp.focus(); }
    return;
  }
  run.locked = true;
  const misses = run.misses || [];
  const dt = hit ? dataTier(p.q, hit.name) : null;
  const tier = hit ? (dt ? dt.t : hit.t) : "time";
  const a = {q: p.q, input: timedOut ? "" : input.trim(), tier, name: hit ? hit.name : "", pts: TIERS[tier].pts, src: dt ? "players" : "list"};
  run.answers.push(a); run.i++;
  target += a.pts;
  if (a.pts) floaters.push({text:"+"+a.pts, tier, born:performance.now()});
  if (tier === "x") shakeUntil = performance.now() + 450;
  if (run.mode === "daily") { store.days[run.day].done = run.i >= ROUNDS; saveStore(); }
  if (hit) record(run.mode === "daily" ? run.day : null, p.q, hit.name);
  const picks = topPicks(p);
  const ls = p.canon.x[Math.floor(Math.random()*p.canon.x.length)];
  const last = run.i >= ROUNDS;
  const head = hit ? `Counted as <b>${esc(hit.name)}</b>.`
    : misses.length ? `Out of time after ${misses.length} ${misses.length === 1 ? "miss" : "misses"}.` : "Engine stalled, no answer in time.";
  const why = !hit ? "" : dt
    ? `<p class="note">${Math.round(dt.share*100)}% of ${dt.total} player answers to this prompt matched yours.</p>`
    : `<p class="note">Rated from the curated list. Player data takes over once this prompt has ${MIN_DATA} answers.</p>`;
  panel.innerHTML = `
  <div class="stack">
    <div class="eyebrow">${modeLabel()} · Prompt ${run.i} of ${ROUNDS}</div>
    <p class="prompt" style="font-size:22px">${esc(p.q)}</p>
    <div class="fb fb-${tier}">
      <div class="fbtop"><span class="chip ${tier}">${TIERS[tier].name}</span><span class="pts ${tier}" data-count="${a.pts}">+0</span></div>
      <p class="note">${head}</p>
      ${why}
      <p class="note">${picks.src === "players" ? "Players' top picks" : "Most common picks"}: <b>${esc(picks.names.join(", "))}</b></p>
      ${ls ? `<p class="note">A long shot you could have tried: <b>${esc(ls)}</b></p>` : ""}
    </div>
    <button class="primary wide" id="next">${last ? "See where you landed" : "Next prompt"}</button>
  </div>`;
  const nx = document.getElementById("next");
  countUp(panel.querySelector("[data-count]"), a.pts, v => "+" + Math.round(v), 520);
  setTimeout(() => nx.focus(), 60);
  nx.onclick = () => last ? result() : ask();
}

function shareText(){
  const s = total(run.answers), m = reached(s);
  const pk = PACKS.find(p => p.id === run.pack);
  const label = run.mode === "daily" ? `OUTLIER #${run.day}` : pk ? `OUTLIER · ${pk.name} pack` : "OUTLIER free flight";
  return `${label} · ${s}/${MAXS}\n🚀 ${fmtKm(kmAt(s))}, ${m.label}\n${run.answers.map(a => TIERS[a.tier].sq).join("")}`;
}

function result(){
  const s = total(run.answers), km = kmAt(s), m = reached(s);
  target = s;
  panel.innerHTML = `
  <div class="stack">
    <div class="eyebrow">${modeLabel()} complete</div>
    <div>
      <div class="result-alt" id="ralt">${fmtKm(0)}</div>
      <p class="lede" style="margin-top:6px">${zone(km)} · highest marker passed: <b style="color:var(--ink)">${esc(m.label)}</b></p>
    </div>
    <div class="stats">
      <div class="stat"><b>${s}</b><span>of ${MAXS} points</span></div>
      <div class="stat"><b>${run.answers.filter(a=>a.tier==="x").length}</b><span>Long shots</span></div>
      <div class="stat"><b>${run.answers.filter(a=>a.pts===0).length}</b><span>Misses</span></div>
    </div>
    <div class="log">${run.answers.map((a,i) => `<div style="--j:${i}">
      <span>${esc(a.q || PROMPTS[run.prompts[i]].q)}</span>
      <strong class="${a.tier}">+${a.pts}</strong>
      <em>${a.tier==="time" ? "No answer" : esc(a.name || a.input)} · <span class="${a.tier}">${TIERS[a.tier].name}</span></em>
    </div>`).join("")}</div>
    <textarea class="share" id="share" readonly aria-label="Share text">${esc(shareText())}</textarea>
    <div class="row">
      <button class="primary" id="copy">Copy result</button>
      <button id="again">${run.pack ? "Play this pack again" : "Free flight"}</button>
      <button id="home">Home</button>
    </div>
    <div class="legend"><span class="c">Common +1</span><span class="u">Uncommon +4</span><span class="r">Rare +7</span><span class="x">Long shot +10</span></div>
  </div>`;
  countUp(document.getElementById("ralt"), s, v => fmtKm(kmAt(v)), 1400);
  const copy = document.getElementById("copy"), ta = document.getElementById("share");
  copy.onclick = () => {
    const done = () => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy result", 1600); };
    try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); copy.textContent = "Press Ctrl+C to copy"; }); }
    catch { ta.select(); copy.textContent = "Press Ctrl+C to copy"; }
  };
  const againPack = run.pack;
  document.getElementById("again").onclick = () => startFree(againPack);
  document.getElementById("home").onclick = home;
}

/* ---------------- Sky renderer ---------------- */
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
let W=0, H=0, DPR=1;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = mulberry32(42);
const stars = Array.from({length:180}, () => ({x:rnd(), y:rnd(), r:rnd()*1.3+.3, p:rnd()*6.28}));
const clouds = Array.from({length:16}, () => ({s:1+rnd()*9, x:rnd(), w:60+rnd()*120, v:(rnd()-.5)*.004}));
const particles = [], floaters = [];
function resize(){ DPR = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize", resize); resize();

const SKY = [[0,[150,208,244]],[7,[74,144,217]],[14,[34,67,127]],[21,[18,28,69]],[28,[8,11,34]],[70,[3,4,12]]];
function skyAt(s){
  s = Math.max(0, s);
  for (let i=1;i<SKY.length;i++){ const [s0,c0]=SKY[i-1],[s1,c1]=SKY[i];
    if (s <= s1){ const t=(s-s0)/(s1-s0); return c0.map((v,j)=>Math.round(v+(c1[j]-v)*t)); } }
  return SKY[SKY.length-1][1];
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

function layout(){
  const narrow = W <= 760;
  return narrow ? {rx: W/2, ry: Math.max(130, H*0.27), ppp: H/12} : {rx: Math.max(160,(W-470)/2), ry: H*0.62, ppp: H/13};
}

let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  // timer
  if (run && run.timerEnd && !run.locked){
    const left = Math.max(0, run.timerEnd - now), bar = document.getElementById("tbar"), tl = document.getElementById("tleft");
    if (bar){ bar.style.transform = `scaleX(${left/(SECONDS*1000)})`; bar.parentNode.classList.toggle("low", left < 5000); }
    if (tl) tl.textContent = Math.ceil(left/1000)+"s";
    if (left <= 0) submit(document.getElementById("ans")?.value || "", true);
  }
  // camera
  const prev = cam;
  cam = reduce ? target : cam + (target - cam) * Math.min(1, dt*1.6);
  if (Math.abs(target-cam) < 0.002) cam = target;
  const thrust = (cam - prev) > 0.0005 || target - cam > 0.02;
  const {rx, ry, ppp} = layout();
  const yOf = s => ry + 34 - (s - cam)*ppp;
  const sTop = cam + (ry+34)/ppp, sBot = cam - (H-ry-34)/ppp;

  // a quick camera shake when a long shot fires
  ctx.save();
  if (!reduce && now < shakeUntil){ const k = (shakeUntil - now) / 450 * 5; ctx.translate((Math.random()-.5)*k, (Math.random()-.5)*k); }
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, rgb(skyAt(sTop))); g.addColorStop(1, rgb(skyAt(sBot)));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // stars
  const sa = Math.max(0, Math.min(1, (cam - 10)/14));
  if (sa > 0){
    for (const st of stars){
      const y = ((st.y*H + cam*ppp*0.06) % H + H) % H;
      ctx.globalAlpha = sa * (0.55 + 0.45*Math.sin(now/900 + st.p));
      ctx.fillStyle = "#fff"; ctx.fillRect(st.x*W, y, st.r, st.r);
    }
    ctx.globalAlpha = 1;
  }

  // clouds
  for (const c of clouds){
    c.x = (c.x + c.v*dt + 1.2) % 1.2;
    const y = yOf(c.s); if (y < -60 || y > H+60) continue;
    const x = c.x*W*1.2 - W*0.1;
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(x, y, c.w/2, c.w/7, 0, 0, 6.283);
    ctx.ellipse(x - c.w*0.18, y - c.w*0.06, c.w/4, c.w/8, 0, 0, 6.283);
    ctx.ellipse(x + c.w*0.15, y - c.w*0.05, c.w/5, c.w/9, 0, 0, 6.283); ctx.fill();
  }

  // milestone markers
  ctx.font = "600 12px 'Chakra Petch', 'Segoe UI', sans-serif"; ctx.textBaseline = "bottom";
  for (const m of MILES){
    if (m.s === 0) continue;
    const y = yOf(m.s); if (y < 40 || y > H+10) continue;
    const dark = m.s < 9;
    ctx.strokeStyle = dark ? "rgba(10,30,70,.35)" : "rgba(220,230,255,.22)";
    ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(16,y); ctx.lineTo(W-16,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = dark ? "rgba(10,30,70,.8)" : (cam >= m.s ? "rgba(255,209,102,.9)" : "rgba(220,230,255,.75)");
    ctx.fillText(`${fmtKm(m.km).toUpperCase()} · ${m.label.toUpperCase()}`, 18, y - 4);
  }

  // moon
  const my = yOf(MAXS + 3.5);
  if (my > -200){
    ctx.fillStyle = "#d9dbe3"; ctx.beginPath(); ctx.arc(rx, my, 90, 0, 6.283); ctx.fill();
    ctx.fillStyle = "rgba(120,125,145,.45)";
    [[-30,-20,18],[25,10,12],[-10,35,9],[40,-35,10],[-45,20,7]].forEach(([dx,dy,r]) => { ctx.beginPath(); ctx.arc(rx+dx, my+dy, r, 0, 6.283); ctx.fill(); });
  }

  // ground + pad
  const gy = yOf(0);
  if (gy < H + 10){
    ctx.fillStyle = "#1f3a32";
    ctx.beginPath(); ctx.moveTo(0, gy+8);
    for (let x=0; x<=W; x+=40) ctx.lineTo(x, gy + 8 - 14*Math.sin(x/170) - 8*Math.sin(x/53));
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = "#3b4658"; ctx.fillRect(rx-46, gy-2, 92, 10);
    ctx.strokeStyle = "#6b7890"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(rx+28, gy); ctx.lineTo(rx+28, gy-84); ctx.lineTo(rx+16, gy-84);
    for (let k=0;k<6;k++){ ctx.moveTo(rx+28, gy-k*14); ctx.lineTo(rx+38, gy-k*14-14); }
    ctx.moveTo(rx+38, gy); ctx.lineTo(rx+38, gy-84); ctx.stroke(); ctx.lineWidth = 1;
  }

  // particles
  if (thrust && !reduce) for (let k=0;k<3;k++) particles.push({x:rx+(Math.random()-.5)*8, y:ry+40, vx:(Math.random()-.5)*40, vy:120+Math.random()*90, life:0, max:.7+Math.random()*.5});
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.life += dt; if (p.life > p.max){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; const t = p.life/p.max;
    ctx.fillStyle = t < .25 ? `rgba(255,${200-t*300|0},90,${1-t})` : `rgba(190,195,210,${(1-t)*.5})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + t*12, 0, 6.283); ctx.fill();
  }

  // rocket
  ctx.save(); ctx.translate(rx, ry);
  const fl = thrust ? 26 + Math.random()*14 : (cam > 0 ? 8 + Math.random()*4 : 0);
  if (fl){
    const fg = ctx.createLinearGradient(0,30,0,30+fl);
    fg.addColorStop(0,"#FFF3C4"); fg.addColorStop(.4,"#FFD166"); fg.addColorStop(1,"rgba(255,143,63,0)");
    ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-8,30); ctx.quadraticCurveTo(0,30+fl*1.4,8,30); ctx.fill();
  }
  ctx.fillStyle = "#FF8F3F";
  ctx.beginPath(); ctx.moveTo(-11,14); ctx.lineTo(-22,34); ctx.lineTo(-11,30); ctx.fill();
  ctx.beginPath(); ctx.moveTo(11,14); ctx.lineTo(22,34); ctx.lineTo(11,30); ctx.fill();
  ctx.fillStyle = "#F2F4FA";
  ctx.beginPath(); ctx.moveTo(-11,30); ctx.lineTo(-11,-14); ctx.quadraticCurveTo(-11,-34,0,-44); ctx.quadraticCurveTo(11,-34,11,-14); ctx.lineTo(11,30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#FF8F3F"; ctx.beginPath(); ctx.moveTo(-9,-26); ctx.quadraticCurveTo(0,-30,9,-26); ctx.quadraticCurveTo(7,-36,0,-44); ctx.quadraticCurveTo(-7,-36,-9,-26); ctx.fill();
  ctx.fillStyle = "#1A2A5E"; ctx.beginPath(); ctx.arc(0,-8,5,0,6.283); ctx.fill();
  ctx.strokeStyle = "#9aa6c4"; ctx.beginPath(); ctx.moveTo(-11,18); ctx.lineTo(11,18); ctx.stroke();
  ctx.restore();

  // floaters
  ctx.font = "700 22px 'Chakra Petch', sans-serif"; ctx.textBaseline = "middle";
  const tc = {c:"#A9B6D6",u:"#5FD3B4",r:"#FFD166",x:"#FF6F91"};
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i], t = (now - f.born)/1400; if (t > 1){ floaters.splice(i,1); continue; }
    ctx.globalAlpha = 1 - t; ctx.fillStyle = tc[f.tier] || "#fff"; ctx.fillText(f.text, rx + 34, ry - 10 - t*40);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  altEl.textContent = fmtKm(kmAt(cam));
  scoreEl.textContent = Math.round(cam);
  requestAnimationFrame(frame);
}

home();
requestAnimationFrame(frame);
initShared();
</script>
